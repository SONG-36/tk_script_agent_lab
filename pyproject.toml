[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tk-script-agent-lab"
version = "0.1.0"
description = "Learning-oriented TikTok script agent lab for RAG, LangGraph, tool calling, trace, and eval practice."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
llm = [
  "openai>=1.0",
]
rag = [
  "numpy>=1.26",
]
graph = [
  "langgraph>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
